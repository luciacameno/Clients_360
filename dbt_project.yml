name: 'clients_360'
version: '1.0.0'
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------
# Configuración por carpeta: base de datos, schema, materialización y tags
# Las bases de datos salen de las variables de entorno (DEV o PRO)
# ---------------------------------------------------------------------
models:
  clients_360:
    staging:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: staging
      +materialized: view
      +tags: ['staging']


      ## bronze no esta porque solo tiene sources
    silver:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: silver
      +materialized: table
      +tags: ['silver']
    gold:
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']
      intermediate:
        +schema: intermediate
        +materialized: view
      core:
        +schema: core
        +materialized: table
      clienteling:
        +schema: clienteling
        +materialized: table
        +tags: ['clienteling']

seeds:
  clients_360:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds