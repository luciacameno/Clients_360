name: 'clients_360'
version: '1.0.0'
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ---------------------------------------------------------------------
# Configuración por carpeta: base de datos, schema, materialización y tags
# Las bases de datos salen de las variables de entorno (DEV o PRO)
# ---------------------------------------------------------------------
models:
  clients_360:
    staging:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: staging
      +materialized: view
      +tags: ['staging']


      ## bronze no esta porque solo tiene sources
    silver:
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      +schema: silver
      +materialized: table
      +tags: ['silver']
    gold:
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      +tags: ['gold']
      intermediate:
        +schema: intermediate
        +materialized: view
      core:
        +schema: core
        +materialized: table
      clienteling:
        +schema: clienteling
        +materialized: table
        +tags: ['clienteling']

seeds:
  clients_360:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    tiers:
      +column_types:
        tier_name: varchar(10)
        tier_rank: number(1,0)
    return_reasons:
      +column_types:
        reason_name: varchar(50)
        reason_group: varchar(20)
    stores:
      +column_types:
        store_id: varchar(30)
        store_name: varchar(50)
        city: varchar(30)
vars:
  incremental_lookback_days: 3        # margen para datos que llegan tarde (hechos incrementales)
  reference_date: ''                  # R0: vacío = la fecha del último evento cargado
  interest_weight_view: 1             # R6
  interest_weight_cart: 3             # R6
  interest_half_life_days: 14         # R6
  interest_hot_threshold: 3           # R6
  interest_warm_threshold: 1          # R6
  interest_lookback_days: 180         # R6
  abandoned_cart_window_days: 90      # R7
  recommendations_top_n: 3            # R10


snapshots:
  clients_360:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: snapshots