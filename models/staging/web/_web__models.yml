models:
  - name: stg_web__events
    description: Eventos web y app con el JSON aplanado. Una fila por evento.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_ts
        data_tests: [not_null]
      - name: action
        data_tests:
          - accepted_values:
              arguments:
                values: ['view_item', 'add_to_cart', 'purchase']
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['web', 'app']
      - name: user_email
        description: Email de la sesión iniciada; nulo si el evento es anónimo.