models:
  - name: stg_crm__accounts
    description: >
      Cuentas del CRM limpias, 1:1 con Bronze. Con la ingesta por deltas, una cuenta
      puede aparecer varias veces (una por carga); silver se queda con la última versión.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [crm_id, _loaded_at]
    columns:
      - name: crm_id
        description: Identificador de la cuenta.
        data_tests: [not_null]
      - name: email
        description: Email limpio (minúsculas, sin espacios, @@ y .con corregidos).
        data_tests: [not_null]
      - name: phone
        description: Teléfono limpio, 9 dígitos.
        data_tests: [not_null]
      - name: tier_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['Silver', 'Gold', 'VIP']
      - name: join_ts
        description: Fecha de alta. Si es nula, la fecha del CSV no se pudo convertir.
        data_tests: [not_null]